[package]
name = "hnl-engine-codegen"
version = "0.1.0"
edition = "2024"
description = "The desired-state codegen kernel: Source/I -> IR -> Emitter -> Change set -> Plan/Apply/Destroy/Revert over an ArtifactStore."
license = "MIT"
repository = "https://github.com/handl-lang/engine-codegen"
readme = "README.md"
keywords = ["handl", "engine", "codegen", "lifecycle", "artifact-store"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/engine-codegen (no crates.io).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
